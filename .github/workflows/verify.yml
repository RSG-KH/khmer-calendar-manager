name: Verify manager

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - run: npm run build:pages
      - run: npm run test:pages
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: manager-browser-verification
          path: build/verification/*.png
